<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Report Lost Item | FindIt</title><link rel="stylesheet" href="css/style.css"></head><body><div id="site-header"></div><main class="form-page"><section class="form-intro"><span class="eyebrow">CAN'T FIND YOUR BELONGING?</span><h1>Report a lost item</h1><p class="muted">Share the details so someone who finds it can reach you.</p><div class="notice">Tip: Do not include passwords, full card numbers, or other sensitive information in your description.</div></section><form id="report-form" class="panel"><input type="hidden" id="report-type" value="Lost"><label>Item name<input id="item-name" required maxlength="80" placeholder="Example: Black wallet"></label><div class="form-row"><label>Category<select id="item-category" required><option value="">Choose category</option><option>Electronics</option><option>ID Card</option><option>Books</option><option>Accessories</option><option>Clothing</option><option>Other</option></select></label><label>Date lost<input id="item-date" type="date" required></label></div><label>Description<textarea id="item-description" required maxlength="500" rows="4" placeholder="Describe the item. Keep one identifying detail private so the owner can verify it."></textarea></label><label>Location<input id="item-location" required maxlength="120" placeholder="Example: Central library, first floor"></label><label>Photo (optional)<input id="item-image" type="file" accept="image/*"></label><label>Contact email<input id="item-email" type="email" required placeholder="you@college.edu"></label><button class="btn full" type="submit">Submit lost report</button><p id="report-message" class="form-message"></p></form></main><div id="site-footer"></div><script src="js/common.js"></script><script src="js/report.js"></script></body></html>
